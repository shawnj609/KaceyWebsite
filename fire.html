    <a class="swap-link" href="about.html">

  <main>
    <section class="subpage fire-hero">
      <div class="subpage-copy">
        <h1 class="subpage-title marquee-title"><span>Hekate&rsquo;s</span> <span>Torch</span></h1>
        <div class="title-rule" aria-hidden="true"></div>
        <p class="credit-line">Fire Dancer<span class="dot">&middot;</span>Flow Artist</p>

      <p class="corner-meta corner-meta--left">Austin, TX</p>
      <a class="corner-meta corner-meta--right" href="#hekates-gallery">Fire + Flow</a>
    </section>
    <section class="actor-gallery-section hekate-gallery-section" id="hekates-gallery" aria-labelledby="hekates-gallery-title">
      <div class="scroll-gallery-heading reveal-on-scroll">
        <h2 id="hekates-gallery-title">
          <span>Hekate's</span>
          <span class="gold-text">gallery</span>
        </h2>
      </div>
      <div class="work-grid hekate-grid" aria-label="Hekate's Torch gallery">
        <a class="work-card video-tile hekate-video-tile reel-card reveal-on-scroll" href="https://youtu.be/PGFGOC93hog" target="_blank" rel="noopener" aria-label="Hekate's Torch video">
          <img src="https://img.youtube.com/vi/PGFGOC93hog/hqdefault.jpg" alt="Hekate's Torch video preview"/>
          <span class="play-mark" aria-hidden="true"></span>
          <span>video</span>
        </a>
        <a class="work-card video-tile hekate-video-tile reel-card reveal-on-scroll" href="https://youtu.be/bO8iNFqhOqs" target="_blank" rel="noopener" aria-label="Hekate's Torch video">
          <img src="https://img.youtube.com/vi/bO8iNFqhOqs/hqdefault.jpg" alt="Hekate's Torch video preview"/>
          <span class="play-mark" aria-hidden="true"></span>
          <span>video</span>
        </a>
        <div class="work-card video-tile hekate-video-tile reveal-on-scroll" aria-label="Hekate's Torch video placeholder">

      </div>

  </main>
  <div class="video-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="video-modal-window">
      <button class="video-modal-close" type="button" aria-label="Close video">X</button>
      <iframe
        class="video-modal-frame"
        title="Video player"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  </div>
  <script>
    var revealItems = document.querySelectorAll(".reveal-on-scroll");
    if ("IntersectionObserver" in window) {
      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.18 });

      revealItems.forEach(function (item) {
        revealObserver.observe(item);
      });
    } else {
      revealItems.forEach(function (item) {
        item.classList.add("is-visible");
      });
    }

    var videoModal = document.querySelector(".video-modal");
    var videoFrame = document.querySelector(".video-modal-frame");
    var videoClose = document.querySelector(".video-modal-close");

    function getYouTubeId(url) {
      try {
        var parsedUrl = new URL(url);
        var pathParts = parsedUrl.pathname.split("/").filter(Boolean);

        if (parsedUrl.hostname.indexOf("youtu.be") !== -1) {
          return pathParts[0];
        }

        if (pathParts[0] === "shorts" || pathParts[0] === "embed") {
          return pathParts[1];
        }

        return parsedUrl.searchParams.get("v");
      } catch (error) {
        return "";
      }
    }

    function getVideoOrigin() {
      if (window.location.protocol === "file:") {
        return "https://kaceysamiee.com";
      }

      return window.location.origin;
    }

    function closeVideoModal() {
      if (!videoModal || !videoFrame) {
        return;
      }

      videoModal.classList.remove("is-open");
      videoModal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("video-modal-open");
      videoFrame.setAttribute("src", "");
    }

    document.querySelectorAll(".reel-card").forEach(function (card) {
      card.addEventListener("click", function (event) {
        var videoId = getYouTubeId(card.getAttribute("href"));

        if (!videoModal || !videoFrame || !videoId) {
          return;
        }

        event.preventDefault();
        var videoOrigin = getVideoOrigin();
        var embedUrl = "https://www.youtube-nocookie.com/embed/" + videoId
          + "?autoplay=1&rel=0&modestbranding=1&playsinline=1"
          + "&origin=" + encodeURIComponent(videoOrigin)
          + "&widget_referrer=" + encodeURIComponent(window.location.href);

        videoFrame.setAttribute("src", embedUrl);
        videoModal.classList.add("is-open");
        videoModal.setAttribute("aria-hidden", "false");
        document.body.classList.add("video-modal-open");
        videoClose.focus();
      });
    });

    if (videoClose) {
      videoClose.addEventListener("click", closeVideoModal);
    }

    if (videoModal) {
      videoModal.addEventListener("click", function (event) {
        if (event.target === videoModal) {
          closeVideoModal();
        }
      });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && videoModal && videoModal.classList.contains("is-open")) {
        closeVideoModal();
      }
    });
  </script>
</body>
</html>
