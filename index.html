<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="The official starter website for Kacey Samiee."/>
  <title>Kacey Samiee</title>
  <link rel="stylesheet" href="site.css?v=end-credits-20260806"/>
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <div class="site-video-background" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assets/media/home/anita-720.m4v" type="video/mp4"/>
    </video>
  </div>
  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1 class="home-title">
          <span class="home-title-first">Kacey</span>
          <span class="home-title-last">Samiee</span>
        </h1>
        <nav class="nav" aria-label="Primary navigation">
          <div class="nav-links">
            <a class="swap-link" href="actor.html">
              <span class="default-label">Actor</span>
              <span class="hover-label">Filmmaker</span>
            </a>
            <a class="swap-link" href="mother-of-drones.html">
              <span class="default-label">Drone Artist</span>
              <span class="hover-label">Mother Of Drones</span>
            </a>
            <a class="swap-link" id="about-link" href="about.html">
              <span class="default-label">About</span>
              <span class="hover-label">Artist</span>
            </a>
          </div>
        </nav>
        <a class="actor-scroll-text home-scroll-text" href="#end-credits">bookings + press below</a>
      </div>
    </section>
    <section class="end-credits" id="end-credits">
      <div class="reveal-on-scroll">
        <a class="btn" href="mailto:kaceysamiee@gmail.com?subject=Bookings%20%26%20Press">Bookings &amp; Press Inquiries</a>
      </div>
    </section>
  </main>
  <script>
    var revealItems = document.querySelectorAll(".reveal-on-scroll");
    if ("IntersectionObserver" in window) {
      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.18 });

      revealItems.forEach(function (item) {
        revealObserver.observe(item);
      });
    } else {
      revealItems.forEach(function (item) {
        item.classList.add("is-visible");
      });
    }

    document.querySelectorAll(".swap-link").forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("mouseleave", function () {
        link.classList.remove("is-hovered");
      });
      link.addEventListener("focus", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("blur", function () {
        link.classList.remove("is-hovered");
      });
    });
  </script>
</body>
</html>
