<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="The official starter website for Kacey Samiee."/>
  <title>Kacey Samiee</title>
  <link rel="stylesheet" href="site.css"/>
</head>
<body>
  <div class="site-video-background" aria-hidden="true">
    <iframe
      id="background-video"
      src="https://www.youtube-nocookie.com/embed/UNyYJboGUTU?autoplay=1&mute=1&loop=1&playlist=UNyYJboGUTU&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&playsinline=1&rel=0&showinfo=0&enablejsapi=1"
      title=""
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      tabindex="-1"
    ></iframe>
  </div>
  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1>Kacey Samiee</h1>
        <nav class="nav" aria-label="Primary navigation">
          <div class="nav-links">
            <a href="#actor">Actor</a>
            <a href="#drone-artist">Drone Artist</a>
            <a href="#artist">Artist</a>
          </div>
        </nav>
      </div>
    </section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var backgroundPlayer;

    function onYouTubeIframeAPIReady() {
      backgroundPlayer = new YT.Player("background-video", {
        events: {
          onReady: function (event) {
            event.target.mute();
            event.target.playVideo();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) {
              event.target.playVideo();
            }
          }
        }
      });
    }
  </script>
</body>
</html>
