<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="The official starter website for Kacey Samiee."/>
  <title>Kacey Samiee</title>
  <link rel="stylesheet" href="site.css?v=home-clean-20260709"/>
</head>
<body>
  <div class="site-video-background" aria-hidden="true">
    <iframe
      id="background-video"
      src="https://www.youtube-nocookie.com/embed/UNyYJboGUTU?autoplay=1&mute=1&loop=1&playlist=UNyYJboGUTU&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&playsinline=1&rel=0&showinfo=0&enablejsapi=1"
      title=""
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      tabindex="-1"
    ></iframe>
  </div>
  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1 class="home-title">
          <span class="home-title-first">Kacey</span>
          <span class="home-title-last">Samiee</span>
        </h1>
        <nav class="nav" aria-label="Primary navigation">
          <div class="nav-links">
            <a class="swap-link" href="actor.html">
              <span class="default-label">Actor</span>
              <span class="hover-label">Filmmaker</span>
            </a>
            <a class="swap-link" href="mother-of-drones.html">
              <span class="default-label">Drone Artist</span>
              <span class="hover-label">Mother Of Drones</span>
            </a>
            <a class="swap-link" id="about-link" href="about.html">
              <span class="default-label">About</span>
              <span class="hover-label">Artist</span>
            </a>
          </div>
        </nav>
      </div>
    </section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var backgroundPlayer;

    function onYouTubeIframeAPIReady() {
      backgroundPlayer = new YT.Player("background-video", {
        events: {
          onReady: function (event) {
            event.target.mute();
            event.target.playVideo();
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) {
              event.target.playVideo();
            }
          }
        }
      });
    }

    document.querySelectorAll(".swap-link").forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("mouseleave", function () {
        link.classList.remove("is-hovered");
      });
      link.addEventListener("focus", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("blur", function () {
        link.classList.remove("is-hovered");
      });
    });
  </script>
</body>
</html>
