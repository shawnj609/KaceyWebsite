<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="The official starter website for Kacey Samiee."/>
  <title>Kacey Samiee</title>
  <link rel="stylesheet" href="site.css?v=media-about-panels-20260709"/>
</head>
<body>
  <div class="site-video-background" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assets/media/home/anita-720.m4v" type="video/mp4"/>
    </video>
  </div>
  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <h1 class="home-title">
          <span class="home-title-first">Kacey</span>
          <span class="home-title-last">Samiee</span>
        </h1>
        <nav class="nav" aria-label="Primary navigation">
          <div class="nav-links">
            <a class="swap-link" href="actor.html">
              <span class="default-label">Actor</span>
              <span class="hover-label">Filmmaker</span>
            </a>
            <a class="swap-link" href="mother-of-drones.html">
              <span class="default-label">Drone Artist</span>
              <span class="hover-label">Mother Of Drones</span>
            </a>
            <a class="swap-link" id="about-link" href="about.html">
              <span class="default-label">About</span>
              <span class="hover-label">Artist</span>
            </a>
          </div>
        </nav>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll(".swap-link").forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("mouseleave", function () {
        link.classList.remove("is-hovered");
      });
      link.addEventListener("focus", function () {
        link.classList.add("is-hovered");
      });
      link.addEventListener("blur", function () {
        link.classList.remove("is-hovered");
      });
    });
  </script>
</body>
</html>
